name: FitFlow CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Markdown Docs
        run: |
          echo "Verifying documentation structure..."
          test -f README.md
          test -f docs/comparison_matrix.md
          test -f docs/architecture_decision_record.md
          echo "All required lab documentation files exist."

      - name: Verify Directory Layout
        run: |
          echo "Checking service scaffolding..."
          test -d frontend
          test -d backend
          test -d ai-service
          echo "Directory structure verified successfully."
